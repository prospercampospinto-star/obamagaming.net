<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Malayalam MN", system-ui, sans-serif;
            color: #5bb9d8;
            background-color: #020202;
            /*background: no-repeat center top;*/
            background-size: cover;
            margin: 10px;
        }

        /* top bar: name left, email right */
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin: 10px;
        }
        a {
            color: #5bb9d8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #5bb9d8;
            margin: 10px;
        }

        section {
            max-width: 400px;
            margin: 30px;
            background: #020202;
            padding: 20px;
            border-radius: 1px;
            border-width: 1px;
            border-style: none none solid none;
            border-color: #5bb9d8;
        }

        /* track row:  name ............ play  0:00 / 3:12 */
        song {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .play {
            font: inherit;
            color: #5bb9d8;
            background: none;
            border: 1px solid #5bb9d8;
            padding: 2px 12px;
            cursor: pointer;
        }
        .play:hover {
            background: #5bb9d8;
            color: #020202;
        }
        .timer {
            min-width: 10ch;
            text-align: right;
            font-size: .9em;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <title>Portfolio</title>
</head>

<body>
<header>
    <name>VincentVanisher</name>
    <a href="mailto:you@example.com">you@example.com</a>
</header>
<hr>

<section>
    <h2>hi.</h2>
</section>

<section>
    <song>
        <span class="title">track 1</span>
        <button class="play">play</button>
        <span class="timer">0:00 / 0:00</span>
        <audio preload="metadata">
            <source src="assets/sounds/aftrr!%20-%20I%20Reap%20What%20I%20Sow.m4a">
        </audio>
    </song>
</section>

<script>
    document.querySelectorAll('song').forEach(song => {
        const audio = song.querySelector('audio');
        const btn   = song.querySelector('.play');
        const timer = song.querySelector('.timer');

        const fmt  = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
        const draw = () => timer.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);

        btn.addEventListener('click', () => audio.paused ? audio.play().catch(() => {}) : audio.pause());

        audio.addEventListener('play', () => {
            // only one track at a time
            document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
            btn.textContent = 'pause';
        });
        audio.addEventListener('pause', () => btn.textContent = 'play');
        audio.addEventListener('ended', () => { audio.currentTime = 0; btn.textContent = 'play'; draw(); });
        audio.addEventListener('loadedmetadata', draw);
        audio.addEventListener('timeupdate', draw);
        audio.addEventListener('error', () => timer.textContent = 'missing');
    });
</script>
</body>
</html>
